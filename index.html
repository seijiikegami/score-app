<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>こいStory Mania</title>
<style>
  :root {
    --purple-dark: #3b0764;
    --purple: #6d28d9;
    --purple-mid: #8b5cf6;
    --purple-light: #c4b5fd;
    --gold: #fbbf24;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, var(--purple-dark), var(--purple) 60%, var(--purple-mid));
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--white);
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(20px, env(safe-area-inset-top)) 20px max(12px, env(safe-area-inset-bottom));
  }

  .header {
    text-align: center;
  }
  .header h1 {
    margin: 0;
    font-size: clamp(20px, 6vw, 30px);
    letter-spacing: 0.03em;
    color: var(--gold);
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  /* ---------- 合計得点表示 ---------- */
  .total-display {
    text-align: center;
  }
  .total-number {
    font-size: clamp(40px, 12vw, 68px);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(251,191,36,0.5), 0 4px 8px rgba(0,0,0,0.4);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .score-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 420px;
    flex: 1;
    justify-content: center;
    padding: 8px 0 0;
  }

  .score-btn {
    border: none;
    border-radius: 14px;
    padding: 0;
    height: 48px;
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    transition: transform 0.06s ease, box-shadow 0.06s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .score-btn:active {
    transform: translateY(5px);
  }

  /* 得点ごとの配色: 寒色(低得点) → 暖色(高得点) */
  .score-btn[data-score="50"] {
    background: linear-gradient(145deg, #a5f3fc, #22d3ee);
    box-shadow: 0 5px 0 #0e7490, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="50"]:active { box-shadow: 0 0 0 #0e7490, 0 3px 6px rgba(0,0,0,0.3); }

  .score-btn[data-score="150"] {
    background: linear-gradient(145deg, #38bdf8, #0284c7);
    box-shadow: 0 5px 0 #075985, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="150"]:active { box-shadow: 0 0 0 #075985, 0 3px 6px rgba(0,0,0,0.3); }

  .score-btn[data-score="250"] {
    background: linear-gradient(145deg, #34d399, #059669);
    box-shadow: 0 5px 0 #065f46, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="250"]:active { box-shadow: 0 0 0 #065f46, 0 3px 6px rgba(0,0,0,0.3); }

  .score-btn[data-score="300"] {
    background: linear-gradient(145deg, #facc15, #eab308);
    box-shadow: 0 5px 0 #a16207, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="300"]:active { box-shadow: 0 0 0 #a16207, 0 3px 6px rgba(0,0,0,0.3); }

  .score-btn[data-score="750"] {
    background: linear-gradient(145deg, #fb923c, #ea580c);
    box-shadow: 0 5px 0 #9a3412, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="750"]:active { box-shadow: 0 0 0 #9a3412, 0 3px 6px rgba(0,0,0,0.3); }

  .score-btn[data-score="1000"] {
    background: linear-gradient(145deg, #f87171, #dc2626);
    box-shadow: 0 5px 0 #991b1b, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="1000"]:active { box-shadow: 0 0 0 #991b1b, 0 3px 6px rgba(0,0,0,0.3); }

  .score-btn[data-score="5000"] {
    background: linear-gradient(145deg, #e879f9, #a21caf);
    box-shadow: 0 5px 0 #701a75, 0 8px 14px rgba(0,0,0,0.35);
  }
  .score-btn[data-score="5000"]:active { box-shadow: 0 0 0 #701a75, 0 3px 6px rgba(0,0,0,0.3); }

  .reset-btn {
    width: 100%;
    max-width: 520px;
    padding: 16px;
    font-size: 19px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    background: linear-gradient(145deg, #64748b, #334155);
    color: white;
    box-shadow: 0 5px 0 #1e293b, 0 8px 14px rgba(0,0,0,0.3);
    transition: transform 0.06s ease, box-shadow 0.06s ease;
  }
  .reset-btn:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 #1e293b;
  }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <h1>こい Story Mania</h1>
  </div>

  <div class="total-display">
    <div class="total-number" id="total-number">0</div>
  </div>

  <div class="score-grid">
    <button class="score-btn" data-score="5000">5000</button>
    <button class="score-btn" data-score="1000">1000</button>
    <button class="score-btn" data-score="750">750</button>
    <button class="score-btn" data-score="300">300</button>
    <button class="score-btn" data-score="250">250</button>
    <button class="score-btn" data-score="150">150</button>
    <button class="score-btn" data-score="50">50</button>
  </div>

  <button class="reset-btn" id="btn-reset">リセット</button>

</div>

<script>
(function () {
  "use strict";

  // ---------------- 状態管理 ----------------
  let total = 0;
  const totalNumberEl = document.getElementById('total-number');

  function updateDisplay() {
    totalNumberEl.textContent = total.toLocaleString('ja-JP');
  }

  // ---------------- 音声 (Web Audio API) ----------------
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playTone(freq, startTime, duration, type, gainPeak) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.25, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playTapSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    playTone(660, now, 0.08, 'square', 0.15);
  }

  // ---------------- 得点ボタン ----------------
  document.querySelectorAll('.score-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const points = parseInt(btn.getAttribute('data-score'), 10);
      total += points;
      updateDisplay();
      playTapSound();
    });
  });

  // ---------------- リセット ----------------
  document.getElementById('btn-reset').addEventListener('click', () => {
    total = 0;
    updateDisplay();
  });

  // iOS: 最初のタップでAudioContextを有効化しておく
  document.body.addEventListener('touchstart', function unlockAudio() {
    getAudioCtx();
    document.body.removeEventListener('touchstart', unlockAudio);
  }, { once: true });

})();
</script>
</body>
</html>
